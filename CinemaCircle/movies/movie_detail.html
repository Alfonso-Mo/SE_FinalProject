<!DOCTYPE html> <!--Added code from codespace, i had to make a new file called movie_detail-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ movie.title }} - CinemaCircle</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #141414;
      color: #f5f5f5;
      margin: 0;
      padding: 40px;
    }
    .back-btn {
      color: #fff;
      background-color: #333;
      padding: 10px 16px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 25px;
    }
    .back-btn:hover {
      background-color: #555;
    }
    .content {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #e50914;
      margin-bottom: 10px;
    }
    .overview {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #ccc;
      margin-bottom: 30px;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background-color: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="content">
    <a href="{% url 'home' %}" class="back-btn">&larr; Back to Movies</a>
    
    <h1>{{ movie.title }}</h1>
    <p class="overview">{{ movie.overview }}</p>

    <!-- The YouTube Embed -->
    {% if trailer_key %}
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/{{ trailer_key }}?autoplay=1" 
          allowfullscreen>
        </iframe>
      </div>
    {% else %}
      <p style="color: #ccc; padding: 20px; border: 1px solid #333; border-radius: 4px;">No official trailer found for this movie on YouTube.</p>
    {% endif %}
  </div>
</body>
</html>
