{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CinemaCircle</title>
    <link rel="stylesheet" href="{% static 'movies/css/style.css' %}">
</head>
<body class="home-page" style="background-color: #141414; color: white; font-family: sans-serif;">
    <div style="max-width: 600px; margin: 50px auto; padding: 30px; background-color: #1f1f1f; border-radius: 8px;">
        <h2>Edit Profile</h2>
        <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            {% csrf_token %}
            {{ user_form.as_p }}
            {{ profile_form.as_p }}
            <button type="submit" style="background-color: #e50914; border: none; padding: 12px 20px; color: white; font-weight: bold; border-radius: 4px; cursor: pointer;">Save Changes</button>
        </form>
        <p style="margin-top: 20px;"><a href="{% url 'home' %}" style="color: #e50914; text-decoration: none;">&larr; Back to Home</a></p>
    </div>
</body>
</html>
