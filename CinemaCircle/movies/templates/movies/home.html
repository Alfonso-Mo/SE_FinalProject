<h1>Welcome to CinemaCircle</h1>
 <!--If The user is authenticated then-->
 {% if user.is_authenticated %}
 <p>Hi, {{user.username }}</p>
 <form method = post action = {%url 'logout' %}>
    {csrf_token }
    <button type = "submit">Log Out</button>
   </form>

   {% else %}
   <a href = "{url 'login' }" >Log In </a>
   {% end if %}
