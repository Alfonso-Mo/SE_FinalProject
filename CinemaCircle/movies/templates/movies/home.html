<!DOCTYPE html> 
<html>
<head>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #141414;
      color: #f5f5f5;
      margin: 0;
      padding: 40px;
    }
    h1 {
      color: #e50914;
      font-size: 2.2rem;
      margin-bottom: 20px;
    }
    a {
      color: #f5f5f5;
      background-color: #e50914;
      padding: 10px 20px;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
    }
    a:hover {
      background-color: #b0060f;
    }
    form button {
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    form button:hover {
      background-color: #555;
    }
    p {
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Welcome to CinemaCircle</h1>
  {% if user.is_authenticated %}
  <p>Hi, {{ user.username }}</p>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log Out</button>
  </form>
  {% else %}
  <a href="{% url 'login' %}">Log In</a>
  {% endif %}
</body>
</html>
